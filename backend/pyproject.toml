readme = "README.md"
authors = [
    { name = "ganavi", email = "ganavi.h321.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.143.0",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
